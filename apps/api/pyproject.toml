[project]
name = "market-sentinel-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.4",
    "uvicorn==0.34.2",
    "sqlalchemy==2.0.41",
    "alembic==1.15.2",
    "psycopg[binary]==3.2.9",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "ruff==0.11.10",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "rfc3339-validator==0.1.4",
    "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
